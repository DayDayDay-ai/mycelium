services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mycelium
      POSTGRES_PASSWORD: mycelium_local
      POSTGRES_DB: mycelium
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - mycelium_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelium"]
      interval: 5s
      retries: 10
volumes:
  mycelium_data:
